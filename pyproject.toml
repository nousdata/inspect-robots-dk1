[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "inspect-robots-dk1"
version = "0.1.0"
description = "Inspect Robots adapter for the TRLC-DK1 follower arm (LeRobot plugin) driven by LeRobot policies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nousdata" }]
keywords = ["robotics", "vla", "trlc-dk1", "dk1", "lerobot", "inspect-robots", "dream-1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# inspect-robots>=0.60 ships inspect_robots.conformance (DeviceSlot, the kit).
dependencies = ["inspect-robots>=0.60", "numpy>=1.24"]

[project.optional-dependencies]
# Real DK1 driver + in-process LeRobot policy inference (torch + the checkpoint).
# The DK1 LeRobot plugin (lerobot_robot_trlc_dk1 + trlc_dk1_control) is not on
# PyPI; it installs from the robot-learning-co/trlc-dk1 repo. lerobot>=0.5
# requires Python>=3.12, hence the marker (the numpy-only core still imports on
# 3.10/3.11). Capped <0.7 for the same reason as inspect-robots-so101: the
# inference seam uses internal-ish lerobot modules that moved within 0.5/0.6.
lerobot = [
    "lerobot[async]>=0.5,<0.7; python_version >= '3.12'",
    "lerobot_robot_trlc_dk1 @ git+https://github.com/robot-learning-co/trlc-dk1 ; python_version >= '3.12'",
]
# Dream Labs' hosted Dream-1 policy: HTTPS + JPEG encoding only (no SDK).
dream = ["requests>=2.31", "pillow>=10"]
dev = [
    "requests>=2.31",
    "types-requests>=2.31",
    "pillow>=10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # numpy 2.5.0's type stubs use 3.12-only syntax that mypy (python_version 3.10)
    # rejects; pin the 2.4.x line for a deterministic dev gate (runtime is free).
    "numpy<2.5",
]

[project.urls]
Homepage = "https://github.com/nousdata/inspect-robots-dk1"
Framework = "https://github.com/robocurve/inspect-robots"
Reference = "https://github.com/robocurve/inspect-robots-so101"
Robot = "https://github.com/robot-learning-co/trlc-dk1"

# Inspect Robots discovers these by entry point. NOTE: the policy entry point is
# named `lerobot`, the same name inspect-robots-so101 registers; install one of
# the two adapters per environment.
[project.entry-points."inspect_robots.embodiments"]
dk1 = "inspect_robots_dk1.embodiment:DK1Embodiment"

[project.entry-points."inspect_robots.policies"]
lerobot = "inspect_robots_dk1.policy:LeRobotPolicy"
dream = "inspect_robots_dk1.dream:DreamPolicy"

[project.scripts]
inspect-robots-dk1-preflight = "inspect_robots_dk1.preflight:main"

# The DK1 plugin is a git direct reference (not on PyPI).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_robots_dk1"]

[tool.hatch.build.targets.sdist]
include = ["src/inspect_robots_dk1", "tests", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "D1"]
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.ruff.lint.isort]
known-first-party = ["inspect_robots_dk1"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/inspect_robots_dk1"]

# torch / lerobot / the DK1 plugin are lazily imported behind pragma'd seams and
# are not test deps; silence mypy's missing-import errors for them.
[[tool.mypy.overrides]]
module = ["torch.*", "lerobot.*", "lerobot_robot_trlc_dk1.*", "trlc_dk1_control.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["inspect_robots_dk1"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
    ": \\.\\.\\.$",
    "pragma: no cover",
]
